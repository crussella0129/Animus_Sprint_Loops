# Dependabot opens scheduled version-update PRs against `dev`; opening a PR
# does not write the branch. Review only at sprint boundaries: merge when
# current and green, otherwise repair the PR until green (or reproduce it in an
# ordinary dependency-only sprint). The accepted update rides the next normal
# `dev` -> `main` sprint checkpoint. Add ecosystems as the project grows.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    commit-message:
      prefix: "deps"
